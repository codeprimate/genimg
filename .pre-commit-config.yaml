repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev in step with the ruff pin in requirements-dev.txt and pyproject.toml
    # so the hook and `make format` produce the same output.
    rev: v0.15.1
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # mypy runs from the project venv: the same binary and the same scope as
  # `make typecheck` (see ADR-024). An isolated hook environment has none of the
  # runtime dependencies, so it reports import-related errors the project never sees.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv, src only)
        entry: .venv/bin/mypy src/
        language: system
        types: [python]
        files: ^src/.*\.py$
        pass_filenames: false
