repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev in step with the ruff pin in requirements-dev.txt and pyproject.toml
    # so the hook and `make format` produce the same output.
    rev: v0.15.1
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-Pillow]
